name: binaryscan

x-product-service: &product-service
  platform: ${BINARYSCAN_PLATFORM:-linux/amd64}
  restart: unless-stopped
  init: true
  read_only: true
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - binaryscan
  volumes:
    - ${BINARYSCAN_DATA_ROOT:-./runtime/data}/application:/data:z
    - ./config/app.yaml:/etc/binaryscan/app.yaml:ro,z
    - ./runtime/secrets/mysql_app_password:/run/secrets/mysql_app_password:ro,z
  environment:
    BINARYSCAN_CONFIG_FILE: /etc/binaryscan/app.yaml
    BINARYSCAN_LOG_LEVEL: ${BINARYSCAN_LOG_LEVEL:-info}
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
  stop_grace_period: 45s

services:
  mysql:
    platform: ${BINARYSCAN_PLATFORM:-linux/amd64}
    image: ${BINARYSCAN_MYSQL_IMAGE:-mysql:9.7.1}
    restart: unless-stopped
    networks:
      - binaryscan
    volumes:
      - ${BINARYSCAN_DATA_ROOT:-./runtime/data}/mysql:/var/lib/mysql:Z
      - ./runtime/secrets/mysql_root_password:/run/secrets/mysql_root_password:ro,Z
      - ./runtime/secrets/mysql_app_password:/run/secrets/mysql_app_password:ro,z
    environment:
      MYSQL_DATABASE: binaryscan
      MYSQL_USER: binaryscan
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$(cat /run/secrets/mysql_root_password)" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s

  app:
    <<: *product-service
    image: ${BINARYSCAN_APP_IMAGE:-binaryscan/app:0.1.0}
    networks:
      - binaryscan
      - access
    ports:
      - "127.0.0.1:${BINARYSCAN_HTTP_PORT:-8080}:8080"
    volumes:
      - ${BINARYSCAN_DATA_ROOT:-./runtime/data}/application:/data:z
      - ./config/app.yaml:/etc/binaryscan/app.yaml:ro,z
      - ./runtime/secrets/mysql_app_password:/run/secrets/mysql_app_password:ro,z
      - ./runtime/secrets/initial_admin_password:/run/secrets/initial_admin_password:ro,Z
    environment:
      BINARYSCAN_CONFIG_FILE: /etc/binaryscan/app.yaml
      BINARYSCAN_LOG_LEVEL: ${BINARYSCAN_LOG_LEVEL:-info}
      BINARYSCAN_INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binaryscan-supervisor", "healthcheck", "app"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  scanner:
    <<: *product-service
    image: ${BINARYSCAN_SCANNER_IMAGE:-binaryscan/scanner:0.1.0}
    environment:
      BINARYSCAN_CONFIG_FILE: /etc/binaryscan/app.yaml
      BINARYSCAN_LOG_LEVEL: ${BINARYSCAN_LOG_LEVEL:-info}
      BINARYSCAN_C_CHECKER_URL: ${BINARYSCAN_C_CHECKER_URL:-http://c-checker:8080}
      BINARYSCAN_JAVA_CHECKER_URL: ${BINARYSCAN_JAVA_CHECKER_URL:-http://java-checker:8080}
      BINARYSCAN_ARCHIVE_SANDBOX_RUN_ROOT: /var/lib/binaryscan-archive/run
    volumes:
      - ${BINARYSCAN_DATA_ROOT:-./runtime/data}/application:/data:z
      - ${BINARYSCAN_DATA_ROOT:-./runtime/data}/archive-sandbox:/var/lib/binaryscan-archive:Z
      - ./config/app.yaml:/etc/binaryscan/app.yaml:ro,z
      - ./runtime/secrets/mysql_app_password:/run/secrets/mysql_app_password:ro,z
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
      - /run/binaryscan-archive:rw,nosuid,nodev,noexec,size=16m,mode=0700,uid=10001,gid=10001
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binaryscan-supervisor", "healthcheck", "scanner"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 30s

  java:
    <<: *product-service
    image: ${BINARYSCAN_JAVA_IMAGE:-binaryscan/java:0.1.0}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binaryscan-worker", "healthcheck", "--role", "bytecode"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 30s

  ghidra:
    <<: *product-service
    image: ${BINARYSCAN_GHIDRA_IMAGE:-binaryscan/ghidra:0.1.0}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binaryscan-worker", "healthcheck", "--role", "native"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 45s

  c-checker:
    platform: ${BINARYSCAN_PLATFORM:-linux/amd64}
    image: ${BINARYSCAN_C_CHECKER_IMAGE:-binaryscan/c-checker:0.1.0}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - binaryscan
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: production
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
        -Djava.io.tmpdir=/tmp -Duser.timezone=UTC
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    healthcheck:
      test: ["CMD", "/opt/binaryscan/bin/c-checker-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 20s

  java-checker:
    platform: ${BINARYSCAN_PLATFORM:-linux/amd64}
    image: ${BINARYSCAN_JAVA_CHECKER_IMAGE:-binaryscan/java-checker:0.1.0}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    networks:
      - binaryscan
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: production
      JAVA_TOOL_OPTIONS: >-
        -Xms64m -Xmx384m -XX:+ExitOnOutOfMemoryError
        -Djava.io.tmpdir=/tmp -Duser.timezone=UTC
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    healthcheck:
      test: ["CMD", "/opt/binaryscan/bin/java-checker-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 20s

networks:
  binaryscan:
    internal: true
  access:
